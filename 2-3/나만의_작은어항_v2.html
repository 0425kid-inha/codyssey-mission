<style>

;text-align:center;background:#f2f5ed;border-radius:10px;color:#8a9880;font-size:11px;line-height:1.8}.fixed{background:#f1f4eb;border-radius:9px;padding:12px;font-size:11px;color:#708268}.reset{width:100%;margin-top:22px;background:transparent;color:#a77b68;font-size:11px;border-color:#e7ddd4}.note{font-size:10px;line-height:1.9;color:#9aa38f;margin-top:22px}.error{position:absolute;inset:120px 30px auto;padding:24px;background:#fff8e9;border-radius:14px;font-size:13px;line-height:1.9}.hidden{display:none!important}dialog{border:1px solid #dfe5d9;border-radius:18px;padding:28px;max-width:380px;color:#304c3c;box-shadow:0 20px 90px #162d3440}dialog::backdrop{background:#1e333867}dialog h2{font-size:19px}dialog p{font-size:13px;line-height:1.9;color:#7d8978}dialog .row{margin-top:22px}.danger{background:#a36550;color:white}body.dark .caption h2{color:#e0e9d7}body.dark .caption p,body.dark .eyebrow{color:#a7b69d}@media(max-width:900px){main{grid-template-columns:minmax(0,1fr) 300px}aside{padding:22px 18px}.tip{display:none}header{padding:0 22px}}@media(max-width:650px){header{height:76px;padding:0 16px}h1{font-size:17px}.saved{font-size:10px}main{height:auto;min-height:0;display:block}.stage{height:59dvh;min-height:410px}aside{border-left:0;overflow:visible;padding:23px}.topbar{left:12px;right:12px;top:12px}.caption{left:20px;bottom:20px}.caption h2{font-size:22px}.caption p{font-size:10px}.views button{padding:8px 11px}.light{padding:9px}h3{margin-top:21px}}

<body>
<header><div class="brand"><div class="logo" aria-hidden="true">◒</div><h1>나만의 작은 어항<span>LITTLE AQUARIUM · A QUIET CORNER</span></h1></div><div class="saved" id="saveStatus" role="status">● 자동 저장</div></header>
<main>
<section class="stage" aria-label="로우폴리 3D 어항과 방">
<canvas id="scene" aria-label="어항 전용 선반, 책상과 암막커튼이 있는 3D 방"></canvas>
<div class="topbar"><div class="views"><button id="roomView" class="active">⌂ 방 전체</button><button id="tankView" disabled>▣ 어항 정면</button></div><button id="roomLight" class="light" aria-pressed="true">☀ 방 조명 ON</button></div>
<div class="caption"><div class="eyebrow">YOUR OWN LITTLE WORLD</div><h2 id="sceneTitle">작은 여유를 놓을 자리</h2><p id="sceneDescription">빈 선반에 나만의 작은 물속 세상을 만들어 보세요.</p></div>
<div class="tip">두 가지 시점으로 느긋하게 감상하세요</div>
<div id="loadError" class="error hidden" role="alert"></div>
</section>
<aside aria-label="어항 꾸미기"><div class="panel-head"><h2>어항 꾸미기</h2><span class="tag" id="typeTag">시작하기</span></div><div id="panel"></div><p class="note">설정은 이 브라우저에 자동으로 저장됩니다.<br>실제 사육 지침이 아닌 감상용 꾸미기 시뮬레이터입니다.</p></aside>
</main>
<dialog id="resetDialog"><h2>선반을 다시 비울까요?</h2><p>현재 어항과 생물, 꾸미기 설정이 모두 삭제됩니다. 방 조명 설정은 유지됩니다.</p><div class="row"><button id="cancelReset">돌아가기</button><button id="confirmReset" class="danger">어항 초기화</button></div></dialog>
<script>
'use strict';
const KEY='little-aquarium-v1';
const variants={guppy:{red:'레드',blue:'블루',yellow:'옐로',mosaic:'모자이크'},shrimp:{cherry:'체리',blueDream:'블루드림',yellow:'옐로',snowball:'스노우볼'},jelly:{dome:'반구형',bell:'작은 종형',umbrella:'넓은 우산형'}};
const palette={blue:0x739dff,purple:0xb59aff,mint:0x79e6c3,pink:0xffa5cf,white:0xe6faff};
const $=id=>document.getElementById(id);
function defaults(type){return type==='freshwater'?{type,tankShape:'rectangle',substrate:'lightSand',decorations:{plants:false,rocks:false,driftwood:false,hideout:false},lightColor:'white',lightBrightness:35,creatures:[]}:{type:'jellyfish',tankShape:'cylinder',lightColor:'blue',lightBrightness:35,creatures:[]};}
function sanitize(raw){
 const safe={version:1,roomLightOn:typeof raw?.roomLightOn==='boolean'?raw.roomLightOn:true,aquarium:null};
 if(!['freshwater','jellyfish'].includes(raw?.aquarium?.type))return safe;
 const a=raw.aquarium,b=defaults(a.type),fresh=a.type==='freshwater';
 if(typeof a.lightBrightness==='number'&&Number.isFinite(a.lightBrightness))b.lightBrightness=Math.max(10,Math.min(100,a.lightBrightness));
 if((fresh?['rectangle','cube']:['cylinder','rounded']).includes(a.tankShape))b.tankShape=a.tankShape;
 if(fresh){if(['lightSand','blackGravel','soil'].includes(a.substrate))b.substrate=a.substrate;for(const key in b.decorations)b.decorations[key]=a.decorations?.[key]===true;}
 else if(Object.hasOwn(palette,a.lightColor))b.lightColor=a.lightColor;
 if(Array.isArray(a.creatures))b.creatures=a.creatures.filter(c=>c&&Object.hasOwn(variants,c.kind)&&(fresh?['guppy','shrimp'].includes(c.kind):c.kind==='jelly')&&Object.hasOwn(variants[c.kind],c.variant)).slice(0,5).map((c,i)=>({id:'restored-'+i,kind:c.kind,variant:c.variant}));
 safe.aquarium=b;return safe;
}
let state;try{state=sanitize(JSON.parse(localStorage.getItem(KEY)));}catch{state=sanitize(null);}
let storageAvailable=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageAvailable=true;$('saveStatus').textContent='● 모든 변경 저장됨';}catch{storageAvailable=false;$('saveStatus').textContent='저장 불가 · 현재 창에서 이용 가능';}}
let engine=null,view='room';
function update(rebuild=true){save();renderPanel();if(engine){engine.lighting();if(rebuild)engine.rebuild();}}
function install(type){if(state.aquarium)return;state.aquarium=defaults(type);update();}
function addCreature(kind,variant){const a=state.aquarium;if(!a||a.creatures.length>=5||!Object.hasOwn(variants[kind]||{},variant))return;if(a.type==='freshwater'?!['guppy','shrimp'].includes(kind):kind!=='jelly')return;a.creatures.push({id:globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random(),kind,variant});update();}
function setView(next){view=next==='tank'&&state.aquarium?'tank':'room';$('roomView').classList.toggle('active',view==='room');$('tankView').classList.toggle('active',view==='tank');}
$('roomView').onclick=()=>setView('room');$('tankView').onclick=()=>setView('tank');
$('roomLight').onclick=()=>{state.roomLightOn=!state.roomLightOn;update(false);};
$('cancelReset').onclick=()=>$('resetDialog').close();$('confirmReset').onclick=()=>{state.aquarium=null;setView('room');$('resetDialog').close();update();};
function renderPanel(){
 const a=state.aquarium,f=a?.type==='freshwater';document.body.classList.toggle('dark',!state.roomLightOn);$('roomLight').textContent=state.roomLightOn?'☀ 방 조명 ON':'☾ 방 조명 OFF';$('roomLight').setAttribute('aria-pressed',String(state.roomLightOn));$('tankView').disabled=!a;
 $('typeTag').textContent=a?(f?'FRESHWATER':'JELLYFISH'):'시작하기';$('sceneTitle').textContent=a?(f?'초록빛 사이, 작은 움직임':'고요하게 떠다니는 빛'):'작은 여유를 놓을 자리';$('sceneDescription').textContent=a?'취향을 하나씩 더하고, 잠시 물속의 시간을 바라보세요.':'빈 선반에 나만의 작은 물속 세상을 만들어 보세요.';
 if(!a){$('panel').innerHTML='<p class="description">오늘의 작은 세상을 골라보세요.<br>선반 한 자리에, 어항 하나를 놓을 수 있어요.</p><button class="install" data-install="freshwater"><span class="icon">𓆝</span><strong>담수 어항 설치 <span style="float:right">↗</span></strong><small>색색의 구피와 작은 새우<br>모래와 수초로 만드는 초록빛 풍경</small></button><button class="install jelly" data-install="jellyfish"><span class="icon">♧</span><strong>해파리 어항 설치 <span style="float:right">↗</span></strong><small>느긋하게 부유하는 해파리<br>다섯 가지 조명으로 채우는 물속</small></button>';document.querySelectorAll('[data-install]').forEach(b=>b.onclick=()=>install(b.dataset.install));return;}
 const shapes=f?[['rectangle','기본 사각형'],['cube','큐브형']]:[['cylinder','원통형'],['rounded','둥근 모서리형']];
 let html='<h3>01 &nbsp; 수조 형태</h3><div class="row">'+shapes.map(([v,n])=>`<button data-shape="${v}" aria-pressed="${a.tankShape===v}" class="${a.tankShape===v?'active':''}">${n}</button>`).join('')+'</div>';
 if(f){html+='<h3>02 &nbsp; 바닥재</h3><select id="substrate" aria-label="바닥재">'+[['lightSand','밝은 모래 · 아이보리'],['blackGravel','검은 자갈 · 차콜'],['soil','갈색 소일 · 딥 브라운']].map(([v,n])=>`<option value="${v}" ${a.substrate===v?'selected':''}>${n}</option>`).join('')+'</select><h3>03 &nbsp; 장식품</h3><div class="checks">'+[['plants','수초'],['rocks','돌'],['driftwood','유목'],['hideout','작은 은신처']].map(([v,n])=>`<label><input type="checkbox" data-decor="${v}" ${a.decorations[v]?'checked':''}>${n}</label>`).join('')+'</div><h3>04 &nbsp; 어항 조명</h3><div class="fixed">◉ &nbsp; 흰색 · 항상 켜짐</div>';}
 else html+='<h3>02 &nbsp; 조명 색상</h3><div class="swatches">'+Object.entries(palette).map(([v,c],i)=>`<button data-color="${v}" aria-label="${['블루','퍼플','민트','핑크','화이트'][i]}" title="${['블루','퍼플','민트','핑크','화이트'][i]}" aria-pressed="${a.lightColor===v}" class="${a.lightColor===v?'active':''}" style="background:#${c.toString(16)}"></button>`).join('')+'</div>';
 html+=`<div style="margin-top:16px"><label for="brightness" style="display:flex;justify-content:space-between;font-size:12px">조명 밝기 <output id="brightnessValue" for="brightness">${a.lightBrightness}%</output></label><input id="brightness" type="range" min="10" max="100" step="1" value="${a.lightBrightness}" style="width:100%;margin:12px 0 0"><div style="display:flex;justify-content:space-between;font-size:10px;color:#8b9984"><span>은은하게</span><span>밝게</span></div></div>`;
 html+=`<h3>${f?'05':'03'} &nbsp; 함께할 생물 <span class="tag" aria-live="polite">${a.creatures.length} / 5</span></h3>`;
 for(const kind of f?['guppy','shrimp']:['jelly'])html+=`<div class="subhead">${{guppy:'구피',shrimp:'미니 새우',jelly:'해파리 · 디자인 바리에이션'}[kind]}</div><div class="species">`+Object.entries(variants[kind]).map(([v,n])=>`<button data-kind="${kind}" data-variant="${v}" ${a.creatures.length>=5?'disabled':''}>${n} <span>＋</span></button>`).join('')+'</div>';
 html+=a.creatures.length?'<ul class="creature-list">'+a.creatures.map((c,i)=>`<li><span>${String(i+1).padStart(2,'0')} &nbsp; ${variants[c.kind][c.variant]} ${{guppy:'구피',shrimp:'새우',jelly:'해파리'}[c.kind]}</span><button data-remove="${i}" aria-label="${i+1}번째 생물 제거">×</button></li>`).join('')+'</ul>':'<p class="empty">아직 물속이 조용하네요.<br>함께할 생물을 추가해 보세요. (최대 5마리)</p>';
 if(a.creatures.length>=5)html+='<p class="description" role="status">어항이 가득 찼어요. 한 마리를 제거하면 새로 추가할 수 있습니다.</p>';
 html+='<button class="reset" id="reset">↺ &nbsp; 어항 초기화</button>';$('panel').innerHTML=html;
 $('brightness').oninput=e=>{a.lightBrightness=Number(e.target.value);$('brightnessValue').textContent=a.lightBrightness+'%';save();engine?.tankLighting();};
 document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{a.tankShape=b.dataset.shape;update();});
 if(f){$('substrate').onchange=e=>{a.substrate=e.target.value;update();};document.querySelectorAll('[data-decor]').forEach(b=>b.onchange=()=>{a.decorations[b.dataset.decor]=b.checked;update();});}
 document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{a.lightColor=b.dataset.color;update();});document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>addCreature(b.dataset.kind,b.dataset.variant));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{a.creatures.splice(Number(b.dataset.remove),1);update();});$('reset').onclick=()=>$('resetDialog').showModal();
}
renderPanel();save();
// 라이브러리만 CDN으로 불러오며 모든 앱 코드는 이 파일에 포함한다.
const library=document.createElement('script');library.src='https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js';library.onload=()=>{try{start3D();}catch(e){showError(e);}};library.onerror=()=>showError(new Error('Three.js 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.'));document.head.appendChild(library);
function showError(e){$('loadError').classList.remove('hidden');$('loadError').textContent='3D 화면을 시작할 수 없습니다. '+e.message;}
function start3D(){
 const T=THREE,canvas=$('scene'),scene=new T.Scene();scene.background=new T.Color(0xe7eade);
 const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
 const camera=new T.PerspectiveCamera(38,1,.1,100);camera.position.set(10,8,12);const look=new T.Vector3(0,1.8,0);
 const mat=(color,extra={})=>new T.MeshStandardMaterial({color,roughness:.8,flatShading:true,...extra});
 function mesh(geo,m,parent,x=0,y=0,z=0){const o=new T.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=!m.transparent;o.receiveShadow=true;parent.add(o);return o;}
 function box(parent,x,y,z,w,h,d,color,extra={}){return mesh(new T.BoxGeometry(w,h,d),mat(color,extra),parent,x,y,z);}
 function sphere(parent,x,y,z,r,color,sx=1,sy=1,sz=1,extra={}){const o=mesh(new T.SphereGeometry(r,12,8),mat(color,extra),parent,x,y,z);o.scale.set(sx,sy,sz);return o;}
 function rod(parent,a,b,r,color){const va=new T.Vector3(...a),vb=new T.Vector3(...b),o=mesh(new T.CylinderGeometry(r,r,va.distanceTo(vb),7),mat(color),parent);o.position.copy(va.add(vb).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),new T.Vector3(...b).sub(new T.Vector3(...a)).normalize());return o;}
 const ambient=new T.AmbientLight(0xc7d3cc,.6);scene.add(ambient);const roomLight=new T.PointLight(0xffdfad,110,22,2);roomLight.position.set(0,6,2);roomLight.castShadow=true;roomLight.shadow.mapSize.set(2048,2048);scene.add(roomLight);
 const fill=new T.DirectionalLight(0xffedd1,1.6);fill.position.set(3,7,5);scene.add(fill);
 const room=new T.Group();scene.add(room);
 box(room,0,-.12,0,10,.24,8,0xc4ad8e);box(room,0,3,-4.06,10,6,.15,0xe4e5d5);box(room,-5.06,3,0,.15,6,8,0xd3d9c4);
 for(let i=0;i<14;i++)box(room,-4.65+i*.72,.008,0,.018,.008,8,0xad9478);
 box(room,0,.13,-3.91,10,.22,.1,0xa8ad92);box(room,-4.91,.13,0,.1,.22,8,0xa8ad92);
 // Window remains completely covered by heavy, folded curtains.
 box(room,-4.91,3.6,-1.5,.08,2.65,3.25,0x675f55);rod(room,[-4.65,5.05,-3.25],[-4.65,5.05,.25],.045,0x6c6656);
 for(let i=0;i<16;i++)box(room,-4.77+(i%2)*.11,3.52,-3.08+i*.21,.19,2.95,.24,i%2?0x7b856d:0x65735d);
